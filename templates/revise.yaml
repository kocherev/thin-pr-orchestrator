id: revise
# A review on a thin-pr draft starts this template. Labeling an issue with it starts nothing.
label: thin-pr:revise
# Measured on the new commit, not the whole draft. Placeholder limits like the others.
budget: { max_files: 6, max_lines: 250 }
spend_usd: 2
steps:
  # The plan is the review itself: one step per review comment. It calls no model.
  - { id: plan,      retries: 0 }
  - { id: implement, model: claude-opus-5-5,   effort: high,   retries: 1 }
  - { id: verify,    retries: 0, loop: { back_to: implement, max: 2 } }
  - { id: review,    model: claude-sonnet-5-5, effort: high,   retries: 1, loop: { back_to: implement, max: 1 } }
  - { id: write,     model: claude-haiku-5-5,  effort: low,    retries: 1 }
