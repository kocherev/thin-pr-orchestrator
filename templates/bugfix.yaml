id: bugfix
label: thin-pr:bugfix
# Placeholder limits until the real-repo eval measures what lands reliably. .thin-pr.yml can override them.
budget: { max_files: 6, max_lines: 250 }
spend_usd: 3
steps:
  - { id: plan,      model: claude-sonnet-5-5, effort: medium, retries: 1 }
  - { id: implement, model: claude-opus-5-5,   effort: high,   retries: 2 }
  - { id: verify,    retries: 0, loop: { back_to: implement, max: 3 } }
  - { id: review,    model: claude-sonnet-5-5, effort: high,   retries: 1, loop: { back_to: implement, max: 2 } }
  - { id: write,     model: claude-haiku-5-5,  effort: low,    retries: 1 }
