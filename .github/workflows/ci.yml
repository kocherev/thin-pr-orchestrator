name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Eval
        run: pnpm eval

      - name: Judge
        env:
          THIN_PR_JUDGE_REPORT: artifacts/judge-report.txt
        run: pnpm eval:judge

      - name: Upload judge report
        uses: actions/upload-artifact@v7
        with:
          name: judge-report
          path: artifacts/judge-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Trace
        env:
          THIN_PR_TRACE_PATH: artifacts/trace.json
        run: pnpm trace

      - name: Upload trace
        uses: actions/upload-artifact@v7
        with:
          name: thin-pr-trace
          path: artifacts/trace.json
          if-no-files-found: error
          retention-days: 14
