name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Python eval cases in pnpm test and pnpm eval run python3 with the standard library only.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Eval
        run: pnpm eval

      - name: Judge
        env:
          THIN_PR_JUDGE_REPORT: artifacts/judge-report.txt
        run: pnpm eval:judge

      - name: Upload judge report
        uses: actions/upload-artifact@v7
        with:
          name: judge-report
          path: artifacts/judge-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Trace
        env:
          THIN_PR_TRACE_PATH: artifacts/trace.json
        run: pnpm trace

      - name: Upload trace
        uses: actions/upload-artifact@v7
        with:
          name: thin-pr-trace
          path: artifacts/trace.json
          if-no-files-found: error
          retention-days: 14

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm console:build

      - name: Wrangler dry run
        run: pnpm --filter console exec wrangler deploy --dry-run

  deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Worker types
        run: pnpm --filter @thin-pr/app exec wrangler types --check

      # The dry run also builds runner/Dockerfile with the repo root as context.
      - name: Wrangler dry run
        run: pnpm --filter @thin-pr/app exec wrangler deploy --dry-run --outdir dist

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests and pushes scan their own commits. A manual run scans the full history.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
