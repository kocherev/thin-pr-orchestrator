name: Nightly eval

# Records the good cases against the live API, writes the report, and grades the runs with the batch judge.
# Nothing is pushed. The results are artifacts. CI on pull requests and main never waits on this workflow.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Each command stops before a request that could pass this many USD.
      THIN_PR_SPEND_LIMIT_USD: "15"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Python eval cases run python3 with the standard library only.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Record live cassettes
        run: pnpm eval:record --all

      - name: Write the report
        run: pnpm eval -- --write

      - name: Judge in one batch
        if: ${{ !cancelled() }}
        env:
          THIN_PR_JUDGE_REPORT: artifacts/judge-report.txt
        run: pnpm eval:judge -- --record

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-eval
          path: |
            evals/report.json
            evals/runs/
            evals/cases/*/cassette.jsonl
            evals/judge-cassette.jsonl
            artifacts/judge-report.txt
          if-no-files-found: warn
          retention-days: 30
