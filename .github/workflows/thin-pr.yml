name: Thin PR

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

# One run at a time per issue, so a command waits for the run it acts on.
concurrency:
  group: thin-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    # The router in packages/github decides what each event does. This condition only keeps the runner from
    # starting for events it would ignore: other labels, plain comments, outsiders and bots.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues'
          && (github.event.label.name == 'thin-pr' || startsWith(github.event.label.name, 'thin-pr:')))
        || (github.event_name == 'issue_comment'
          && startsWith(github.event.comment.body, '/thin-pr')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      # Full history and every branch, so a second label can force-push thin-pr/<issue> with a lease.
      # No stored credentials: the checks run repo code, and only the push gets the token.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run the event
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THIN_PR_TRACE_PATH: artifacts/trace.json
          # With an endpoint set, the trace goes to that OTLP backend instead of the artifact. See docs/telemetry.md.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          # The runner has no git identity. These name the commit on thin-pr/<issue>.
          GIT_AUTHOR_NAME: thin-pr[bot]
          GIT_AUTHOR_EMAIL: thin-pr@example.invalid
          GIT_COMMITTER_NAME: thin-pr[bot]
          GIT_COMMITTER_EMAIL: thin-pr@example.invalid
        run: node --experimental-sqlite --disable-warning=ExperimentalWarning --import tsx packages/github/src/action.ts

      - name: Upload trace
        if: always() && vars.OTEL_EXPORTER_OTLP_ENDPOINT == ''
        uses: actions/upload-artifact@v7
        with:
          name: thin-pr-trace
          path: artifacts/trace.json
          if-no-files-found: error
          retention-days: 14
