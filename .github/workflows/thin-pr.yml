name: Thin PR

on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: thin-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event.label.name == 'thin-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run labeled issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THIN_PR_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' && 'live' || 'replay' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THIN_PR_TRACE_PATH: artifacts/trace.json
        run: node --experimental-sqlite --disable-warning=ExperimentalWarning --import tsx packages/github/src/action.ts

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thin-pr-trace
          path: artifacts/trace.json
          if-no-files-found: error
          retention-days: 14
