name: Thin PR

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: thin-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event.label.name == 'thin-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      # Full history and every branch, so a second label can force-push thin-pr/<issue> with a lease.
      # No stored credentials: the checks run repo code, and only the push gets the token.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run labeled issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THIN_PR_MODEL: ${{ secrets.ANTHROPIC_API_KEY != '' && 'live' || 'replay' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THIN_PR_TRACE_PATH: artifacts/trace.json
          # The runner has no git identity. These name the commit on thin-pr/<issue>.
          GIT_AUTHOR_NAME: thin-pr[bot]
          GIT_AUTHOR_EMAIL: thin-pr@example.invalid
          GIT_COMMITTER_NAME: thin-pr[bot]
          GIT_COMMITTER_EMAIL: thin-pr@example.invalid
        run: node --experimental-sqlite --disable-warning=ExperimentalWarning --import tsx packages/github/src/action.ts

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thin-pr-trace
          path: artifacts/trace.json
          if-no-files-found: error
          retention-days: 14
