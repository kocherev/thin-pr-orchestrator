name: Thin PR

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # The repo's CI finishing on a thin-pr branch, so its result shows on the draft as thin-pr / ci.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# One run at a time per issue or pull request, so a command waits for the run it acts on, and the events for one
# review queue behind its revise run, which then finds the reply and stops. A finished CI run gets its own group:
# GitHub keeps one waiting run per group and cancels the rest.
concurrency:
  group: thin-pr-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  orchestrate:
    # The router in packages/github decides what each event does. This condition only keeps the runner from
    # starting for events it would ignore: other labels, plain comments, approvals, other branches, outsiders and bots.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'workflow_dispatch'
        && startsWith(github.event.workflow_run.head_branch, 'thin-pr/'))
      || (github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues'
          && (github.event.label.name == 'thin-pr' || startsWith(github.event.label.name, 'thin-pr:')))
        || (github.event_name == 'issue_comment'
          && startsWith(github.event.comment.body, '/thin-pr')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
        || (github.event_name == 'pull_request_review'
          && startsWith(github.event.pull_request.head.ref, 'thin-pr/')
          && github.event.review.state != 'approved'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
        || (github.event_name == 'pull_request_review_comment'
          && startsWith(github.event.pull_request.head.ref, 'thin-pr/')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: push the branch, and delete it on cancel. checks: one check per gate rule on the pushed commit. issues: the progress
    # comment and command replies. pull-requests: open or update the draft, read reviews, reply on the draft.
    permissions:
      # actions: start the repo's CI on the pushed branch (the ci-workflow input).
      actions: write
      contents: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      # Full history and every branch, so a second label can force-push thin-pr/<issue> with a lease.
      # No stored credentials: the checks run repo code, and only the push gets the token.
      # A review checks out the draft branch at its head; every other event, the default branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same Action another repo installs. See docs/install.md.
      - name: Run the event
        uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          ci-workflow: ci.yml
          # With an endpoint set, the trace goes to that OTLP backend instead of the artifact. See docs/telemetry.md.
          otel-endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otel-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
