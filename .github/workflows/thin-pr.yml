name: Thin PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  checks: write
  issues: write

concurrency:
  group: thin-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event.label.name == 'thin-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run labeled issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-sqlite --disable-warning=ExperimentalWarning --import tsx packages/github/src/action.ts
